# Render Blueprint: the Fidelia API for field testing, on Render's free plan,
# with the database on Neon's free plan.
# Render dashboard → New → Blueprint → pick this repository.
#
# Free-plan behaviour to expect:
#   * The service sleeps after ~15 minutes without traffic; the first request
#     after that takes up to about a minute. The merchant app queues sales
#     offline and retries, so nothing is lost; the customer app shows "Retry".
#   * No background worker (none on the free plan): Celery tasks do not run,
#     and shop videos are converted by the API itself (MEDIA_PROCESSING
#     unset). The API does not need a worker to serve the apps.
#
# Runs the same Docker image as production (backend-api/Dockerfile), so what
# is tested here is what ships.
#
# This is a TEST environment: payments are simulated (no real money moves),
# EXCEPT at a venue whose merchant connected their own Wave Business account
# (pilot option B): there a Wave payment is real and goes straight to that
# merchant's wallet. The seeded test accounts share one password (app/seed.py). Never point real users
# or real payments at it. See docs/technical/DEPLOY-TEST.md. Production is
# render.production.yaml (docs/technical/PRODUCTION.md).
#
# /metrics answers 404 here (no METRICS_TOKEN): set one to scrape this
# environment too.

services:
  - type: web
    runtime: docker
    name: fidelia-api
    plan: free
    # Frankfurt: the lowest-latency Render region from Abidjan.
    region: frankfurt
    # Paths from the repository root. Only changes to the API trigger a deploy.
    dockerfilePath: ./backend-api/Dockerfile
    dockerContext: ./backend-api
    buildFilter:
      paths:
        - backend-api/**
    # The test environment follows `integration`: every push there deploys.
    # Production follows `trunk` (render.production.yaml).
    branch: integration
    # Migrations run on every start (a free instance has no pre-deploy step).
    # `upgrade head` is a no-op when the schema is current, so a wake-up from
    # sleep costs nothing extra. Then the same uvicorn command as the image's
    # (flags explained in backend-api/Dockerfile).
    dockerCommand: sh -c "alembic -c alembic.ini upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*' --no-access-log"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Rate-limit counters (app/rate_limiter.py), shared and kept across
      # restarts. Free Key Value: no persistence, which is fine for counters.
      - key: RATE_LIMIT_STORAGE_URI
        fromService:
          type: keyvalue
          name: fidelia-kv
          property: connectionString
      # Paste Neon's connection string exactly as Neon shows it
      # (postgresql://...?sslmode=require). app/db.py adapts it for asyncpg.
      # Prefer the direct endpoint; the pooled "-pooler" one also works.
      - key: DATABASE_URL
        sync: false
      # Signs login tokens. Generated once by Render; never commit one.
      - key: FIDELIA_SECRET_KEY
        generateValue: true
      # Test environment only.
      - key: FIDELIA_ENV
        value: test
      # "wave": a venue with a connected Wave account is paid through Wave
      # with the merchant's own key; every other payment stays simulated.
      - key: MOBILE_MONEY_PROVIDER
        value: wave
      # Seals the merchants' Wave keys at rest. Generated once by Render; if it
      # ever changes, merchants must reconnect Wave.
      - key: FIDELIA_ENCRYPTION_KEY
        generateValue: true
      # Seeds the sample venues, pharmacies and deals the apps show, once;
      # later starts detect them and add nothing.
      - key: FIDELIA_SEED_SAMPLE
        value: "1"
      # Password of the shared test logins (07 00 00 00 01/02/03/04/09),
      # app/seed.py. A secret: set it in the dashboard, never in this file.
      # Unset = the sample logins get no password.
      - key: FIDELIA_SEED_PASSWORD
        sync: false
      # Offer alerts to the customer app (app/services/push.py). "console" logs
      # them; set "fcm" plus FCM_PROJECT_ID and FCM_SERVICE_ACCOUNT_JSON (the
      # Firebase service account key file's content) to send real pushes.
      - key: PUSH_PROVIDER
        value: console
      # The investor brief at /brief/ (app/api/investor_brief.py): one shared
      # password, at least 12 characters, given to investors by the team.
      # Unset or shorter, the brief is closed. Changing it signs everyone out.
      - key: INVESTOR_BRIEF_PASSWORD
        sync: false
      # The store reviewers' login (app/services/review_account.py): one number
      # that signs in to Fidelia and Fidelia Pro with this password, already
      # verified, with its own hidden sample shop. Set both or neither.
      - key: STORE_REVIEW_PHONE
        sync: false
      - key: STORE_REVIEW_PASSWORD
        sync: false
      # The public site's address, for the brief's "Website" link (e.g.
      # https://fidelia.onrender.com). Unset, the link is left out.
      - key: FIDELIA_SITE_URL
        sync: false
      # Shop photos and videos (app/services/media_storage.py). Videos are
      # converted by the image's ffmpeg, one at a time, in the API process
      # (no worker here): a 60 s clip takes a few minutes on the free
      # instance. Render's free
      # disk is wiped on deploy, so media goes to Cloudflare R2 (free 10 GB,
      # no bandwidth fees). Until these are set, uploads use the local disk
      # and vanish on the next deploy.
      # - key: MEDIA_STORAGE
      #   value: r2
      # - key: R2_ACCOUNT_ID
      #   sync: false
      # - key: R2_ACCESS_KEY_ID
      #   sync: false
      # - key: R2_SECRET_ACCESS_KEY
      #   sync: false
      # - key: R2_BUCKET
      #   value: fidelia-media
      # - key: MEDIA_PUBLIC_BASE_URL
      #   sync: false
      # Browser origins allowed to call the API. The native apps are not
      # affected; the public site calls only /api/client-events (error reports,
      # when built with VITE_FIDELIA_API_BASE); add its domain here once it has
      # one. fidelia-installer is the admin and field-agent site, at the
      # address its Render service was given. Never list a guessed
      # onrender.com name: Render names are global and may belong to someone
      # else: Render asks for it when the Blueprint is created. Enter the
      # fidelia-installer service's address as Render shows it (usually
      # https://fidelia-installer.onrender.com, with a suffix if that name was
      # taken), and correct it in the dashboard if it differs.
      - key: CORS_ORIGINS
        sync: false

  # Rate-limit counters. Reachable only from this account's services
  # (empty ipAllowList).
  - type: keyvalue
    name: fidelia-kv
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
