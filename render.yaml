# Render Blueprint: the Hossouko API for field testing, on Render's free plan,
# with the database on Neon's free plan.
# Render dashboard → New → Blueprint → pick this repository.
#
# Free-plan behaviour to expect:
#   * The service sleeps after ~15 minutes without traffic; the first request
#     after that takes up to about a minute. The merchant app queues sales
#     offline and retries, so nothing is lost; the customer app shows "Retry".
#   * No background worker: Celery tasks do not run. The API does not need
#     them to serve the apps.
#
# This is a TEST environment: payments are simulated (no real money moves),
# EXCEPT at a venue whose merchant connected their own Wave Business account
# (pilot option B): there a Wave payment is real and goes straight to that
# merchant's wallet. Plus shared test numbers with a fixed code (TEST_OTP_NUMBERS). Never point real users
# or real payments at it. See docs/technical/DEPLOY-TEST.md. Production is
# render.production.yaml (docs/technical/PRODUCTION.md).
#
# /metrics answers 404 here (no METRICS_TOKEN): set one to scrape this
# environment too.

services:
  - type: web
    runtime: python
    name: hossouko-api
    plan: free
    # Frankfurt: the lowest-latency Render region from Abidjan.
    region: frankfurt
    rootDir: backend-api
    # Deploys from the default branch; the latest work is on `integration`.
    # Merge it first, or set the branch this service should follow.
    # branch: integration
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Migrations run on every start (a free instance has no pre-deploy step).
    # `upgrade head` is a no-op when the schema is current, so a wake-up from
    # sleep costs nothing extra.
    # --no-access-log: uvicorn's own access log prints query strings, which
    # carry phone numbers; the API writes its own line (app/observability.py).
    startCommand: alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*' --no-access-log
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Paste Neon's connection string exactly as Neon shows it
      # (postgresql://...?sslmode=require). app/db.py adapts it for asyncpg.
      # Prefer the direct endpoint; the pooled "-pooler" one also works.
      - key: DATABASE_URL
        sync: false
      # Signs login tokens. Generated once by Render; never commit one.
      - key: HOSSOUKO_SECRET_KEY
        generateValue: true
      # Test environment only.
      - key: HOSSOUKO_ENV
        value: test
      # "wave": a venue with a connected Wave account is paid through Wave
      # with the merchant's own key; every other payment stays simulated.
      - key: MOBILE_MONEY_PROVIDER
        value: wave
      # Seals the merchants' Wave keys at rest. Generated once by Render; if it
      # ever changes, merchants must reconnect Wave.
      - key: HOSSOUKO_ENCRYPTION_KEY
        generateValue: true
      # Seeds the sample venues, pharmacies and deals the apps show, once;
      # later starts detect them and add nothing.
      - key: HOSSOUKO_SEED_SAMPLE
        value: "1"
      # Phone sign-in codes (app/services/otp_sender.py). "console" writes the
      # code to the service log; set "africastalking" plus AT_USERNAME and
      # AT_API_KEY to send real SMS. OTP_DEV_ECHO=1 would return the code in
      # the API response so testers need no SIM, but then anyone can sign in
      # as any number: never on a deployment holding real data.
      - key: OTP_SENDER
        value: console
      # Shared test accounts: these numbers sign in with their fixed code, no
      # SMS, no log line. 07 00 00 00 01 is a customer; 07 00 00 00 02 is the
      # seeded merchant of the second sample maquis, 07 00 00 00 03 its
      # cashier, 07 00 00 00 04 a field agent (hossouko-installer). Shown on the public
      # download page, so anyone can use them: only with HOSSOUKO_ENV=test (the
      # API refuses to start with it in production, ignores it elsewhere).
      - key: TEST_OTP_NUMBERS
        value: "+2250700000001:000000,+2250700000002:000000,+2250700000003:000000,+2250700000004:000000"
      # Shop photos and videos (app/services/media_storage.py). Videos are
      # converted by the ffmpeg bundled in the imageio-ffmpeg wheel (no system
      # ffmpeg on this runtime), one at a time, in the API process: a 60 s
      # clip takes a few minutes on the free instance. Render's free
      # disk is wiped on deploy, so media goes to Cloudflare R2 (free 10 GB,
      # no bandwidth fees). Until these are set, uploads use the local disk
      # and vanish on the next deploy.
      # - key: MEDIA_STORAGE
      #   value: r2
      # - key: R2_ACCOUNT_ID
      #   sync: false
      # - key: R2_ACCESS_KEY_ID
      #   sync: false
      # - key: R2_SECRET_ACCESS_KEY
      #   sync: false
      # - key: R2_BUCKET
      #   value: hossouko-media
      # - key: MEDIA_PUBLIC_BASE_URL
      #   sync: false
      # Browser origins allowed to call the API. The native apps are not
      # affected; the public site calls only /api/client-events (error reports,
      # when built with VITE_HOSSOUKO_API_BASE); add its domain here once it has
      # one. hossouko-installer is the admin and field-agent site, at the
      # address its Render service was given. Never list a guessed
      # onrender.com name: Render names are global and may belong to someone
      # else.
      - key: CORS_ORIGINS
        value: https://hossouko-installer.onrender.com
