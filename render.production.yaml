# Render Blueprint: Fidelia in PRODUCTION (the pilot with real merchants).
# Render dashboard → New → Blueprint → this repository, Blueprint path
# `render.production.yaml`. render.yaml stays the test environment: shared
# test numbers, simulated payments, free plan. Never mix the two databases.
#
# Before the first deploy, and the full checklist: docs/technical/PRODUCTION.md.
# Values marked `sync: false` are asked for when the Blueprint is created and
# then live in the dashboard only; keep docs/technical/PRODUCTION.md's table of
# settings up to date whenever one changes there.

services:
  # The API. Served to the world through Cloudflare (PRODUCTION.md § 3):
  # requests that do not carry Cloudflare's origin secret are refused.
  - type: web
    runtime: docker
    name: fidelia-api-prod
    # Paid: always on (no sleep), a pre-deploy step. Two instances, so one
    # crashing or a bad host does not take the API down. Everything they
    # share lives outside them: the database, rate-limit counters (Key
    # Value), media (R2). Metrics are scraped from each instance by
    # fidelia-metrics-prod.
    plan: starter
    numInstances: 2
    region: frankfurt
    # The same image as the test environment and CI (backend-api/Dockerfile);
    # its start command is the one that runs here.
    dockerfilePath: ./backend-api/Dockerfile
    dockerContext: ./backend-api
    # Production follows `trunk`; the test environment follows `integration`
    # (render.yaml). Promote by merging integration into trunk.
    branch: trunk
    # Migrations run once per deploy, before traffic moves to the new build;
    # a failed migration stops the deploy and the old build keeps serving.
    preDeployCommand: alembic -c alembic.ini upgrade head
    # Liveness only: a database blip must not make Render restart a healthy
    # process. The uptime monitor checks /ready, which includes the database.
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      # Proof a request came through Cloudflare (app/edge.py): `openssl rand
      # -hex 32`, the same value given to terraform/cloudflare
      # (TF_VAR_origin_secrets), which puts it in the X-Origin-Auth rule.
      # Made by hand so Cloudflare can be set up before this service exists.
      # To rotate: set "new,old" here, apply the new one, then drop the old.
      - key: CLOUDFLARE_ORIGIN_SECRET
        sync: false
      # Rate-limit counters shared by both instances and kept across deploys.
      - key: RATE_LIMIT_STORAGE_URI
        fromService:
          type: keyvalue
          name: fidelia-kv-prod
          property: connectionString
      # Videos are converted by fidelia-worker-prod, not in the API
      # (app/services/media_jobs.py).
      - key: MEDIA_PROCESSING
        value: worker
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: fidelia-kv-prod
          property: connectionString
      - key: FIDELIA_ENV
        value: production
      # The production database, never the test one. Neon: the direct
      # endpoint, with point-in-time restore enabled (PRODUCTION.md § Database).
      - key: DATABASE_URL
        sync: false
      - key: FIDELIA_SECRET_KEY
        generateValue: true
      # Seals merchants' Wave keys. If it ever changes, every merchant must
      # reconnect Wave: back it up in the team's password manager.
      - key: FIDELIA_ENCRYPTION_KEY
        generateValue: true
      # Payment webhook signing secrets (comma-separated: current,previous).
      - key: MOBILE_MONEY_SECRETS
        sync: false
      # A venue with a connected Wave account is paid through Wave; every
      # other venue is paid at the counter. Nothing is ever simulated here.
      - key: MOBILE_MONEY_PROVIDER
        value: wave

      # --- Investor brief (app/api/investor_brief.py) ---------------------
      # The investor brief at /brief/ (app/api/investor_brief.py): one shared
      # password, at least 12 characters, given to investors by the team.
      # Unset or shorter, the brief is closed. Changing it signs everyone out.
      - key: INVESTOR_BRIEF_PASSWORD
        sync: false
      # The store reviewers' login (app/services/review_account.py): one number
      # that signs in to Fidelia and Fidelia Pro with this password, already
      # verified, with its own hidden sample shop. Set both or neither.
      - key: STORE_REVIEW_PHONE
        sync: false
      - key: STORE_REVIEW_PASSWORD
        sync: false
      # The public site's address, for the brief's "Website" link (e.g.
      # https://fidelia.onrender.com). Unset, the link is left out.
      - key: FIDELIA_SITE_URL
        sync: false

      # --- Offer alerts (app/services/push.py) -----------------------------
      - key: PUSH_PROVIDER
        value: fcm
      - key: FCM_PROJECT_ID
        sync: false
      # The Firebase service account key file's content (JSON), one line.
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false

      # The Fidelia team's WhatsApp for suggestions (merchants always,
      # customers from 100 points). Unset: the menu entry stays hidden.
      - key: FIDELIA_SUGGESTIONS_WHATSAPP
        sync: false

      # --- Media (photos, videos) -------------------------------------------
      # Required in production: the instance disk is wiped on every deploy.
      - key: MEDIA_STORAGE
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: fidelia-media-prod
      # The bucket is created with the EU jurisdiction (ARTCI.md § 4).
      - key: R2_JURISDICTION
        value: eu
      - key: MEDIA_PUBLIC_BASE_URL
        sync: false

      # --- Browsers and monitoring ------------------------------------------
      # The production installer site's exact address (and the public site's
      # domain once it has one), comma-separated. Never a guessed name.
      - key: CORS_ORIGINS
        sync: false
      # Grafana Cloud's scrape job sends it as the basic-auth password. Copy
      # it from the dashboard into Grafana Cloud; rotate both together.
      - key: METRICS_TOKEN
        generateValue: true
      # JSON lines for the log service (Render log stream, PRODUCTION.md).
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO

  # Shop video conversion (app/services/media_jobs.py), one at a time. Same
  # image as the API, another command. Needs the database, R2 and the queue.
  - type: worker
    runtime: docker
    name: fidelia-worker-prod
    plan: starter
    region: frankfurt
    dockerfilePath: ./backend-api/Dockerfile
    dockerContext: ./backend-api
    branch: trunk
    autoDeploy: false
    dockerCommand: celery -A app.celery_app.celery_app worker --concurrency 1 --prefetch-multiplier 1 --loglevel INFO
    # On a deploy, Celery finishes the video in hand before exiting (up to 5
    # minutes). A job cut off anyway is queued again after 20 minutes
    # (app/celery_app.py, visibility_timeout).
    maxShutdownDelaySeconds: 300
    envVars:
      - key: FIDELIA_ENV
        value: production
      # The same production database as the API (Neon, direct endpoint).
      - key: DATABASE_URL
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: fidelia-kv-prod
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: fidelia-kv-prod
          property: connectionString
      - key: MEDIA_STORAGE
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: fidelia-media-prod
      # The bucket is created with the EU jurisdiction (ARTCI.md § 4).
      - key: R2_JURISDICTION
        value: eu
      - key: MEDIA_PUBLIC_BASE_URL
        sync: false
      - key: LOG_FORMAT
        value: json

  # Rate-limit counters and the worker's queue. noeviction: a queued video
  # job must never be dropped to make room (rate-limit keys expire on their
  # own). Reachable only from this account's services.
  - type: keyvalue
    name: fidelia-kv-prod
    plan: starter
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # Scrapes /metrics on every API instance over the private network and
  # remote-writes to Grafana Cloud (monitoring/alloy/config.alloy). Replaces
  # Grafana Cloud's own scrape of the public URL, which would reach one
  # instance at random.
  - type: pserv
    runtime: docker
    name: fidelia-metrics-prod
    plan: starter
    region: frankfurt
    dockerfilePath: ./monitoring/alloy/Dockerfile
    dockerContext: ./monitoring/alloy
    branch: trunk
    autoDeploy: false
    envVars:
      - key: API_DISCOVERY_HOST
        value: fidelia-api-prod-discovery
      - key: METRICS_TOKEN
        fromService:
          type: web
          name: fidelia-api-prod
          envVarKey: METRICS_TOKEN
      # Grafana Cloud → your stack → Prometheus → "Send metrics": the remote
      # write URL, the instance ID (username) and an access policy token with
      # metrics:write.
      - key: GRAFANA_REMOTE_WRITE_URL
        sync: false
      - key: GRAFANA_REMOTE_WRITE_USERNAME
        sync: false
      - key: GRAFANA_REMOTE_WRITE_TOKEN
        sync: false

  # The admin and field-agent site, pointed at the production API. Built from
  # its own repository.
  - type: web
    runtime: static
    name: fidelia-installer-prod
    # The repository keeps its original name until it is renamed on GitHub.
    repo: https://github.com/giss1408/djassa-installer
    branch: trunk
    buildCommand: npm ci && npm run lint && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      # The production API's public address, on the Cloudflare domain
      # (https://api.<domain>). Never the onrender.com address: that one
      # refuses requests that did not come through Cloudflare.
      - key: VITE_FIDELIA_API_BASE
        sync: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https:; img-src 'self' https: data:; media-src https:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
