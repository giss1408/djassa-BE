version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: fidelia
      POSTGRES_PASSWORD: fidelia
      POSTGRES_DB: fidelia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
