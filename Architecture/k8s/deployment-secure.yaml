apiVersion: apps/v1
kind: Deployment
metadata:
  name: djassa-api
  namespace: djassa
  labels:
    app: djassa-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: djassa-api
  template:
    metadata:
      labels:
        app: djassa-api
    spec:
      serviceAccountName: djassa-api-sa
      imagePullSecrets:
        - name: regcred
      containers:
        - name: api
          image: registry.example.com/djassa/api:RELEASE-2026-09-19
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: djassa-app-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
