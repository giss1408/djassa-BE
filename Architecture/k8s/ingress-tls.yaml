apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hossouko-ingress
  namespace: hossouko
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
spec:
  tls:
    - hosts:
        - hossouko.example.com
      secretName: hossouko-tls
  rules:
    - host: hossouko.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hossouko-api
                port:
                  number: 8000
