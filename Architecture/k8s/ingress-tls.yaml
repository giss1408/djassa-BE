apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: djassa-ingress
  namespace: djassa
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
spec:
  tls:
    - hosts:
        - djassa.example.com
      secretName: djassa-tls
  rules:
    - host: djassa.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: djassa-api
                port:
                  number: 8000
