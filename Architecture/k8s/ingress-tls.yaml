apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fidelia-ingress
  namespace: fidelia
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
spec:
  tls:
    - hosts:
        - fidelia.example.com
      secretName: fidelia-tls
  rules:
    - host: fidelia.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fidelia-api
                port:
                  number: 8000
