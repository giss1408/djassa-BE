apiVersion: v1
kind: ServiceAccount
metadata:
  name: hossouko-api-sa
  namespace: hossouko

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hossouko-api-role
  namespace: hossouko
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hossouko-api-rolebinding
  namespace: hossouko
subjects:
  - kind: ServiceAccount
    name: hossouko-api-sa
roleRef:
  kind: Role
  name: hossouko-api-role
  apiGroup: rbac.authorization.k8s.io
