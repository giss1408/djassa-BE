apiVersion: v1
kind: ServiceAccount
metadata:
  name: hossouko-sa
  namespace: hossouko

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: hossouko
  name: hossouko-role
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "secrets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hossouko-rolebinding
  namespace: hossouko
subjects:
  - kind: ServiceAccount
    name: hossouko-sa
    namespace: hossouko
roleRef:
  kind: Role
  name: hossouko-role
  apiGroup: rbac.authorization.k8s.io
