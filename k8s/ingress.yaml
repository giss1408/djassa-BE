apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fidelia-ingress
  namespace: fidelia
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  rules:
    - host: api.fidelia.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fidelia-api
                port:
                  number: 80
  tls:
    - hosts:
        - api.fidelia.example.com
      secretName: fidelia-tls
