apiVersion: apps/v1
kind: Deployment
metadata:
  name: fidelia-api
  namespace: fidelia
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fidelia-api
  template:
    metadata:
      labels:
        app: fidelia-api
    spec:
      containers:
        - name: api
          image: registry.example.com/fidelia/api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: fidelia-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
