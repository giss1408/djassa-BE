name: CI — Build & Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Secrets cannot be read in `if:` directly, so expose the registry as an
      # env var. Empty when the repo has no registry configured: the image is
      # then still built, scanned and tested, just never pushed.
      REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
      # Local tag, independent of the registry, for the scan steps.
      LOCAL_IMAGE: djassa-api:${{ github.sha }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: djassa
          POSTGRES_PASSWORD: djassa
          POSTGRES_DB: djassa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U djassa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-api
          file: ./backend-api/Dockerfile
          push: false
          # Load into the local Docker so Syft and Trivy can inspect it.
          load: true
          tags: ${{ env.LOCAL_IMAGE }}

      - name: Generate SBOM (Syft)
        run: |
          mkdir -p sbom
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft "$LOCAL_IMAGE" -o json > sbom/sbom.json

      - name: Scan image (Trivy, report only)
        # Report-only here; trivy-scan.yml is the gate that fails on CRITICAL.
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --format table --severity CRITICAL,HIGH "$LOCAL_IMAGE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend-api/requirements.txt

      - name: Install dependencies
        working-directory: backend-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations on Postgres
        working-directory: backend-api
        env:
          DATABASE_URL: postgresql+asyncpg://djassa:djassa@127.0.0.1:5432/djassa
          DJASSA_SECRET_KEY: ci-only-secret
        run: alembic upgrade head

      - name: Run pytest
        working-directory: backend-api
        env:
          OTEL_SDK_DISABLED: 'true'
        run: pytest -q

      - name: Log in to registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.REGISTRY_URL != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.REGISTRY_URL != ''
        run: |
          docker tag "$LOCAL_IMAGE" "$REGISTRY_URL/djassa/api:${{ github.sha }}"
          docker push "$REGISTRY_URL/djassa/api:${{ github.sha }}"

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: ./sbom
          if-no-files-found: ignore
