name: Trivy Image Scan

on:
  push:
    branches: [ main, master ]

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker build -t registry.example.com/fidelia/api:dev -f backend-api/Dockerfile backend-api

      # Pinned to the commit of v0.36.0 (Trivy v0.70.0): tags can be moved,
      # a commit cannot. The old v0.3.0 shipped a Trivy that misread Debian 13.
      # Fails only on CRITICAL vulnerabilities that have a fix to install;
      # unfixed ones are listed by security-scan.yml's report.
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: registry.example.com/fidelia/api:dev
          scanners: vuln
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
          format: 'table'
